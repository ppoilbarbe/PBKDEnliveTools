[workspace]
name = "pbkdenlivetools"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
c-compiler = "*"
make = "*"
pkg-config = "*"
mlt = "*"
ffmpeg = "*"
clang-format = "*"
cppcheck = "*"

[tasks]
build = "make build"
install = "make install"
uninstall = "make uninstall"
test = "make test"
clean = "make clean"
hooks = "pre-commit run --all-files"
