repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-xml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: clang-format
        name: Format C code (clang-format)
        language: conda
        additional_dependencies: [clang-format]
        entry: clang-format -i
        files: \.c$
        exclude: frei0r\.h$

      - id: cppcheck
        name: Static analysis (cppcheck)
        language: conda
        additional_dependencies: [cppcheck]
        entry: cppcheck --std=c11 --enable=warning,style,performance,portability
          --error-exitcode=1 --suppress=missingIncludeSystem
        files: \.c$
        exclude: frei0r\.h$

      - id: c-syntax
        name: Check C syntax (gcc -fsyntax-only)
        language: conda
        additional_dependencies: [c-compiler]
        entry: bash -c 'for f in "$@"; do gcc -fsyntax-only -Wall -Wextra -Werror -std=c11 -I"$(dirname "$f")" "$f" || exit 1; done' --
        files: \.c$

      - id: extendedges-test
        name: Run extendedges test suite
        language: conda
        additional_dependencies: [c-compiler, make]
        entry: make -C extendedges test
        pass_filenames: false
        files: ^extendedges/.*\.(c|h)$
